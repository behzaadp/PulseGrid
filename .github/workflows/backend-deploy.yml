name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'pulsegrid-engine/**' # Only triggers when backend code changes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: pulsegrid.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          cd pulsegrid-engine
          docker build -t pulsegrid.azurecr.io/pulsegrid-engine:${{ github.sha }} .
          docker push pulsegrid.azurecr.io/pulsegrid-engine:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pulsegrid-engine'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          images: 'pulsegrid.azurecr.io/pulsegrid-engine:${{ github.sha }}'